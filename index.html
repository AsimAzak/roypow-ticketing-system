<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ROYPow Ticketing System</title>
<style>
  :root {
  --login-bg: url('images/roypow_ticketing_system_bkg.png');
  --dashboard-bg: url('images/roypow_ticket_system_bkg.png');
}
  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; height: 100%; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; color: white;}

  body.login-bg {
    background: var(--login-bg) center center/cover no-repeat, linear-gradient(135deg, #222, #111);
    background-blend-mode: overlay;
    min-height: 100vh;
  }
  body.dashboard-bg {
    background: var(--dashboard-bg) center center/cover no-repeat, #111;
    min-height: 100vh;
  }
  #login-section {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .login-logo {
    width: 180px;       /* Adjust as needed */
    height: 64px;       /* Adjust as needed */
    object-fit: contain;
    margin-bottom: 1.6rem;
    margin-top: -2rem;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 0.4rem;
    box-shadow: 0 4px 18px #1115;
  }
  #login-section h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 3rem;
    margin-bottom: 1rem;
    user-select: none;
    letter-spacing: 8px;
  }
  #login-form { width: 280px; }
  #login-form label { display: block; font-size: 0.85rem; margin-bottom: 0.2rem; text-align: left;}
  #login-form input[type="text"], #login-form input[type="password"] { width: 100%; padding: 0.5rem 0.6rem; margin-bottom: 1rem; border: none; border-radius: 3px;}
  #login-form button { width: 100%; background-color: #0b5ed7; padding: 0.5rem; border: none; border-radius: 3px; cursor: pointer; color: white; font-weight: 600; font-size: 1rem;}
  #login-form button:hover { background-color: #074db3;}
  #login-error { color: #ff4d4d; margin-top: 0.5rem; height: 1.2rem; font-size: 0.9rem; }
  #dashboard {
    background: none !important;
    min-height: 100vh;
    padding: 2rem 3rem 4rem 3rem;
    display: none;
    position: relative;
    color: white;
  }
  #dashboard h2 { margin-top: 0; font-weight: 700; }
  #dashboard p.welcome-text { font-size: 1rem; margin-bottom: 1.5rem;}
  #logout-btn {
    position: absolute;
    right: 30px;
    top: 30px;
    background-color: #c62828;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 3px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    color: white;
  }
  #logout-btn:hover { background-color: #9e1e1e; }
  #tickets-container { overflow-x: auto; margin-top: 1rem; }
  table { width: 100%; border-collapse: collapse;}
  thead th { border-bottom: 2px solid #444; padding: 0.5rem 0.8rem; font-weight: 600; font-size: 0.9rem; text-align: left; white-space: nowrap; }
  tbody td { padding: 0.4rem 0.8rem; font-size: 0.85rem; border-bottom: 1px solid #333; white-space: nowrap;}
  tbody button.delete-btn { padding: 0.2rem 0.6rem; background-color: #c62828; border: none; border-radius: 3px; color: white; font-weight: 600; cursor: pointer;}
  tbody button.delete-btn:hover { background-color: #9e1e1e;}
  #ticket-create-form { margin-top: 2rem; background: #222; padding: 1rem 1.5rem; border-radius: 6px; max-width: 900px; color: #eee;}
  #ticket-create-form h3 { margin-top: 0; margin-bottom: 1rem; font-weight: 700;}
  #ticket-create-form label { display: block; margin-top: 0.8rem; font-weight: 600;}
  #ticket-create-form input[type="text"], #ticket-create-form select, #ticket-create-form input[type="date"] { width: 100%; padding: 0.35rem 0.4rem; border-radius: 3px; border: none; margin-top: 0.15rem; font-size: 0.9rem; color: black;}
  #ticket-create-form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;}
  #ticket-create-form button { margin-top: 1rem; background-color: #0b5ed7; padding: 0.6rem 1rem; border-radius: 4px; color: white; border: none; font-weight: 700; cursor: pointer; font-size: 1rem;}
  #ticket-create-form button:hover { background-color: #074db3; }
  #ticket-create-error { color: #ff4d4d; margin-top: 0.4rem; font-weight: 600; min-height: 1.2rem;}
</style>
</head>
<body class="login-bg">

<div id="login-section" role="main">
  <!-- LOGO START -->
  <img class="login-logo" src="images/ROYPOW_logo.png" alt="ROYPow Logo" /> <!-- Set your logo path here -->
  <!-- LOGO END -->
  <form id="login-form" aria-label="Login Form">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required />
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <button type="submit">Login</button>
  </form>
  <p id="login-error" aria-live="polite"></p>
</div>

<div id="dashboard" role="main" aria-label="User Dashboard">
  <button id="logout-btn" aria-label="Logout">Logout</button>
  <h2>User Dashboard</h2>
  <p class="welcome-text" id="welcome-msg"></p>

  <h3>Your Tickets</h3>
  <div id="tickets-container">
    <table id="tickets-table" aria-label="Tickets Table">
      <thead>
        <tr>
          <th>Service Order Number</th>
          <th>Status</th>
          <th>Service Type</th>
          <th>Product</th>
          <th>Tracking</th>
          <th>SKU Number</th>
          <th>Creator</th>
          <th>Creation Date</th>
          <th id="actions-header" style="display:none;">Actions</th>
        </tr>
      </thead>
      <tbody><!-- Tickets injected here --></tbody>
    </table>
  </div>
  <form id="ticket-create-form" style="display:none;" aria-label="Create Ticket Form">
    <h3>Create New Ticket</h3>
    <div id="ticket-create-error" aria-live="assertive"></div>
    <div class="row">
      <div>
        <label for="input-id">Service Order Number</label>
        <input type="text" id="input-id" placeholder="e.g. SO-10006" required />
      </div>
      <div>
        <label for="input-status">Status</label>
        <select id="input-status" required>
          <option value="">--Select Status--</option>
          <option value="pending">Pending</option>
          <option value="in progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
          <option value="shipped">Shipped</option>
        </select>
      </div>
      <div>
        <label for="input-service-type">Service Type</label>
        <input type="text" id="input-service-type" placeholder="e.g. Repair" required />
      </div>
      <div>
        <label for="input-product">Product</label>
        <input type="text" id="input-product" placeholder="e.g. Lithium Battery 51V" required />
      </div>
      <div>
        <label for="input-tracking">Tracking</label>
        <input type="text" id="input-tracking" placeholder="e.g. 1Z999AA123456789" />
      </div>
      <div>
        <label for="input-sku-number">SKU Number</label>
        <input type="text" id="input-sku-number" placeholder="e.g. LITH-51V-100AH" required />
      </div>
      <div>
        <label for="input-creator">Creator</label>
        <input type="text" id="input-creator" placeholder="e.g. John Zong" required />
      </div>
      <div>
        <label for="input-creation-date">Creation Date</label>
        <input type="date" id="input-creation-date" required />
      </div>
    </div>
    <button type="submit">Create Ticket</button>
  </form>
</div>

<script>
const users = [

  { id: 2, username: "bob", password: "pass456", name: "Bob", role: "user" },
  { id: 3, username: "pape", password: "pape1", name: "Pape", role: "user" },
  { id: 4, username: "asim", password: "1953", name: "Asim", role: "user" }, // ← ADD THIS
  { id: 99, username: "admin", password: "adminpass", name: "John Zong", role: "admin" }
];

let tickets = [
  // Admin tickets
  {

  },
  {

    tracking: "1Z999AA987654321",
    skuNumber: "BMS-24V-SMART",
    creator: "John Zong",
    creationDate: "2025-07-14",
  },
  {

    tracking: "—",
    skuNumber: "CHR-36V-20A",

  },
  {

    tracking: "1Z999AA135792468",

  },
  {

  // Alice's tickets
  {
    id: "SO-30001",

    serviceType: "Return",
    product: "Portable Power Pack",
    tracking: "ALICETRACK001",

  },
  {
    id: "SO-30002",

    product: "48V Golf Cart Pack",
    tracking: "ALICETRACK002",
    skuNumber: "GOLF-48V-LFP",
    creator: "Alice",
    creationDate: "2024-06-09",
  },

  // Bob's tickets
  {
    id: "SO-40001",
    userId: 2,
    status: "in progress",
    serviceType: "Repair",
    product: "Battery Charger",
    tracking: "BOBTRACK001",
    skuNumber: "CHR-36V-20A",
    creator: "Bob",

  },
  {
    id: "SO-40002",

    status: "shipped",

    tracking: "BOBTRACK002",

  },

  // Pape's tickets
  {
    id: "SO-50001",

  {

  // Asim's tickets
  {
    id: "SO-20001",

    tracking: "ASMTRACK001",
    skuNumber: "START-MOT-12V",

  },
  {
    id: "SO-20002",
    userId: 4,
    status: "in progress",
    serviceType: "Inspection",
    product: "Battery Charger",
    tracking: "ASMTRACK002",
    skuNumber: "CHR-48V-10A",
    creator: "Asim",
    creationDate: "2024-06-10",
  }
];

function formatStatus(s) {
  if (!s) return "";
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function renderTickets(user) {
  const tbody = document.querySelector("#tickets-table tbody");
  tbody.innerHTML = "";

  let ticketsToShow = user.role === "admin"
    ? tickets
    : tickets.filter(t => t.userId === user.id);

  if (ticketsToShow.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#aaa;">No tickets found.</td></tr>`;
    return;
  }

  ticketsToShow.forEach(ticket => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${ticket.id}</td>
      <td>${formatStatus(ticket.status)}</td>
      <td>${ticket.serviceType}</td>
      <td>${ticket.product}</td>
      <td>${ticket.tracking || "—"}</td>
      <td>${ticket.skuNumber}</td>
      <td>${ticket.creator}</td>
      <td>${ticket.creationDate}</td>
      ${
        user.role === "admin" 
          ? `<td><button class="delete-btn" aria-label="Delete ticket ${ticket.id}">Delete</button></td>`
          : `<td></td>`
      }
    `;
    // Add delete handler for admin buttons
    if (user.role === "admin") {
      tr.querySelector(".delete-btn").addEventListener("click", () => {
        if (confirm(`Are you sure you want to delete ticket ${ticket.id}?`)) {
          tickets = tickets.filter(t => t.id !== ticket.id);
          renderTickets(user);
        }
      });
    }
    tbody.appendChild(tr);
  });
}

document.getElementById("login-form").addEventListener("submit", function(e) {
  e.preventDefault();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  const user = users.find(u => u.username === username && u.password === password);
  if (user) {
    localStorage.setItem("loggedInUserId", user.id);
    localStorage.setItem("loggedInUsername", user.username);
    localStorage.setItem("loggedInUserRole", user.role);
    localStorage.setItem("loggedInUserName", user.name);
    showDashboard(user);
  } else {
    document.getElementById("login-error").textContent = "Invalid username or password";
  }
});

function showDashboard(user) {
  document.body.classList.remove('login-bg');
  document.body.classList.add('dashboard-bg');
  document.getElementById("login-section").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("welcome-msg").textContent = `Welcome, ${user.name}! (${formatStatus(user.role)})`;

  renderTickets(user);

  // Show/hide ticket creation form for admin only
  const createForm = document.getElementById("ticket-create-form");
  if (user.role === "admin") {
    createForm.style.display = "block";
    document.getElementById("actions-header").style.display = "table-cell";
  } else {
    createForm.style.display = "none";
    document.getElementById("actions-header").style.display = "none";
  }
}

document.getElementById("logout-btn").addEventListener("click", () => {
  localStorage.clear();
  document.body.classList.remove('dashboard-bg');
  document.body.classList.add('login-bg');
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login-section").style.display = "flex";
  document.getElementById("login-error").textContent = "";
  document.getElementById("login-form").reset();
});

document.getElementById("ticket-create-form").addEventListener("submit", e => {
  e.preventDefault();
  const errorElem = document.getElementById("ticket-create-error");
  errorElem.textContent = "";

  const id = document.getElementById("input-id").value.trim();
  const status = document.getElementById("input-status").value.trim().toLowerCase();
  const serviceType = document.getElementById("input-service-type").value.trim();
  const product = document.getElementById("input-product").value.trim();
  const tracking = document.getElementById("input-tracking").value.trim() || "—";
  const skuNumber = document.getElementById("input-sku-number").value.trim();
  const creator = document.getElementById("input-creator").value.trim();
  const creationDate = document.getElementById("input-creation-date").value;

  if (!id || !status || !serviceType || !product || !skuNumber || !creator || !creationDate) {
    errorElem.textContent = "Please fill in all required fields.";
    return;
  }

  if (tickets.some(t => t.id.toLowerCase() === id.toLowerCase())) {
    errorElem.textContent = "Service Order Number already exists.";
    return;
  }

  const newTicket = {
    id,
    userId: 99, // admin userId fixed
    status,
    serviceType,
    product,
    tracking,
    skuNumber,
    creator,
    creationDate,
  };

  tickets.push(newTicket);
  document.getElementById("ticket-create-form").reset();

  const currentUserId = Number(localStorage.getItem("loggedInUserId"));
  const currentUser = users.find(u => u.id === currentUserId);
  if(currentUser) renderTickets(currentUser);
});

window.onload = () => {
  const loggedInUserId = localStorage.getItem("loggedInUserId");
  const loggedInUsername = localStorage.getItem("loggedInUsername");
  const loggedInUserRole = localStorage.getItem("loggedInUserRole");
  const loggedInUserName = localStorage.getItem("loggedInUserName");

  if (loggedInUserId && loggedInUsername && loggedInUserRole && loggedInUserName) {
    showDashboard({
      id: Number(loggedInUserId),
      username: loggedInUsername,
      role: loggedInUserRole,
      name: loggedInUserName
    });
  }
};
</script>

</body>
</html>
