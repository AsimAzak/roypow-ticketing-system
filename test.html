<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>JS Test</title></head>
<body>
<script>
  const name = prompt("Enter your name:");
  if (name) {
    document.body.innerHTML = `<h1>Hello, ${name}!</h1>`;
  } else {
    document.body.innerHTML = "<h1>No name entered</h1>";
  }
</script>
</body>
</html>
